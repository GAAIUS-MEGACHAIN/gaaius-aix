version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: gaaius_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: gaaius_ai
    volumes:
      - mongodb_data:/data/db
    networks:
      - gaaius_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gaaius_backend
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://admin:password@mongodb:27017
      DB_NAME: gaaius_ai
      GROQ_API_KEY: ${GROQ_API_KEY:-gsk_placeholder}
      HF_TOKEN: ${HF_TOKEN:-hf_placeholder}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret}
      BACKEND_URL: http://backend:8000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gaaius_network
    volumes:
      - ./backend:/app/backend
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gaaius_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - gaaius_network
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

volumes:
  mongodb_data:

networks:
  gaaius_network:
    driver: bridge
